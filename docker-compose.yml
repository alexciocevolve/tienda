# Only the database runs in Docker. The schema is NOT created here (no
# docker-entrypoint-initdb.d): Alembic owns it, so every change is a versioned migration.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
    volumes:
      - shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432" # development only: never publish a database port in production

volumes:
  shop_pgdata:
